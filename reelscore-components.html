<title>Reelscore Components</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&display=swap">
<style>
/* Reelscore's own tokens and component styles (tokens.css + bundle.css from the design system) */
/* Reelscore — generated from tokens.json */
:root, [data-theme="dark"] {
  --surface-0: #010103; --surface-100: #16151a; --surface-200: #1a191e; --surface-300: #292929; --surface-400: #333238;
  --surface-glass: rgba(22, 21, 26, 0.72); --backdrop: #0d1c25; --scrim: rgba(1, 1, 3, 0.88);
  --line: #131217; --outline: #727178; --ink: #ffffff; --ink-muted: #8b989f; --ink-faint: #5f5f64;
  --brand: #da2026; --brand-hover: #c41a20; --brand-press: #a8161b; --brand-text: #f0484d; --on-brand: #ffffff;
  --gold: #efa60d; --gold-deep: #de9500; --on-gold: #120d02; --focus: #ffffff;
  --shadow-glow: 0 6px 18px rgba(218, 32, 38, 0.35); --shadow-poster: 0 10px 24px rgba(0, 0, 0, 0.55); --shadow-bar: 0 -1px 0 #131217;
}
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --gutter-sm: 16px; --gutter-md: 32px; --gutter-lg: 64px;
  --radius-xs: 3px; --radius-sm: 4px; --radius-md: 8px; --radius-pill: 999px;
  --tap-target: 44px; --nav-height: 64px; --nav-height-sm: 56px; --bottom-nav-height: 64px; --button-height: 44px; --chip-height: 36px; --poster-width-sm: 128px; --poster-width-lg: 184px;
  --bp-sm: 480px; --bp-md: 768px; --bp-lg: 1024px; --bp-xl: 1280px;
  --z-row-arrows: 2; --z-nav: 100; --z-overlay: 200;
  --font-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif;
}


/* Reelscore components. Values come from tokens.css; layout adapts to the component's own width (container queries) so it works in any column, phone first. */

body { margin: 0; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.rs-icon { display: block; flex: none; }

:where(.rs-btn, .rs-iconbtn, .rs-chip, .rs-tab, .rs-avatar, .rs-nav__link, .rs-bottomnav__item, .rs-card__poster, .rs-rate__hit, .rs-wordmark, .rs-row__all):focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* Button ------------------------------------------------------------ */
.rs-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: var(--button-height); min-width: var(--tap-target); padding: 0 var(--space-5);
  border: 0; border-radius: var(--radius-pill); cursor: pointer; text-decoration: none;
  font: 700 13px/16px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
  transition: background-color .15s ease, box-shadow .15s ease, transform .1s ease;
}
.rs-btn:active { transform: scale(.98); }
.rs-btn--sm { height: 36px; padding: 0 var(--space-4); font-size: 12px; }
.rs-btn--lg { height: 52px; padding: 0 var(--space-6); font-size: 14px; }
.rs-btn--block { display: flex; width: 100%; }
.rs-btn--primary { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-glow); }
.rs-btn--primary:hover { background: var(--brand-hover); }
.rs-btn--primary:active { background: var(--brand-press); }
.rs-btn--secondary { background: var(--surface-300); color: var(--ink); }
.rs-btn--secondary:hover { background: var(--surface-400); }
.rs-btn--ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--outline); }
.rs-btn--ghost:hover { background: var(--surface-300); }
.rs-btn:disabled, .rs-btn[aria-disabled="true"] { background: var(--surface-300); color: var(--ink-faint); box-shadow: none; cursor: not-allowed; }

/* IconButton -------------------------------------------------------- */
.rs-iconbtn {
  position: relative; display: inline-grid; place-items: center; flex: none;
  width: 40px; height: 40px; padding: 0; border: 0; border-radius: var(--radius-pill);
  background: none; color: var(--ink); cursor: pointer; transition: background-color .15s ease, color .15s ease;
}
.rs-iconbtn--sm { width: 28px; height: 28px; color: var(--ink-muted); }
.rs-iconbtn--lg { width: 48px; height: 48px; }
.rs-iconbtn:hover { background: var(--surface-300); color: var(--ink); }
.rs-iconbtn--filled { background: var(--surface-300); }
.rs-iconbtn--filled:hover { background: var(--surface-400); }
.rs-iconbtn--outline { box-shadow: inset 0 0 0 1px var(--outline); }
.rs-iconbtn--scrim { background: var(--scrim); }
.rs-iconbtn--scrim:hover { background: var(--surface-400); }
.rs-iconbtn.is-pressed { color: var(--brand); }
.rs-card__watched.is-pressed { color: var(--ink); }
.rs-iconbtn__dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface-0); }
/* small buttons keep a 44px hit area on touch screens */
.rs-iconbtn--sm::after { content: ""; position: absolute; inset: -8px; }
@media (pointer: coarse) { .rs-iconbtn { width: var(--tap-target); height: var(--tap-target); } .rs-iconbtn--sm { width: 32px; height: 32px; } }

/* NavBar ------------------------------------------------------------ */
.rs-nav { container-type: inline-size; background: var(--surface-0); box-shadow: 0 1px 0 var(--line); }
.rs-nav--sticky { position: sticky; top: 0; z-index: var(--z-nav); }
.rs-nav__inner { display: flex; align-items: center; gap: var(--space-4); height: var(--nav-height-sm); padding: 0 var(--gutter-sm); }
.rs-wordmark { font-family: var(--font-display); font-size: 28px; line-height: 1; letter-spacing: .02em; color: var(--brand); text-decoration: none; text-transform: uppercase; padding-top: 3px; border-radius: 2px; }
.rs-nav__links { display: none; flex: 1; justify-content: center; height: 100%; }
.rs-nav__links ul { display: flex; gap: var(--space-2); margin: 0; padding: 0; list-style: none; height: 100%; }
.rs-nav__link { position: relative; display: flex; align-items: center; height: 100%; padding: 0 var(--space-4); color: var(--ink-muted); text-decoration: none; font: 500 15px/20px var(--font-sans); }
.rs-nav__link:hover { color: var(--ink); }
.rs-nav__link.is-active { color: var(--ink); }
.rs-nav__link.is-active::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); }
.rs-nav__actions { display: flex; align-items: center; gap: var(--space-1); margin-left: auto; }
.rs-nav__bell { display: none; }
.rs-avatar { display: grid; place-items: center; width: 36px; height: 36px; margin-left: var(--space-2); padding: 0; border: 0; border-radius: 50%; overflow: hidden; background: var(--surface-300); color: var(--ink); cursor: pointer; font: 600 13px/1 var(--font-sans); box-shadow: 0 0 0 2px var(--surface-400); }
.rs-avatar img { width: 100%; height: 100%; object-fit: cover; }
@container (min-width: 768px) {
  .rs-nav__inner { height: var(--nav-height); padding: 0 var(--gutter-md); gap: var(--space-6); }
  .rs-wordmark { font-size: 34px; }
  .rs-nav__links { display: flex; }
  .rs-nav__actions { margin-left: 0; }
  .rs-nav__bell { display: inline-grid; }
}
@container (min-width: 1280px) { .rs-nav__inner { padding: 0 var(--gutter-lg); } }

/* BottomNav (phones) ------------------------------------------------ */
.rs-bottomnav { background: var(--surface-0); box-shadow: var(--shadow-bar); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rs-bottomnav--fixed { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-nav); }
.rs-bottomnav ul { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0; padding: 0; list-style: none; height: var(--bottom-nav-height); }
.rs-bottomnav__item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); height: 100%; color: var(--ink-muted); text-decoration: none; font: 500 11px/14px var(--font-sans); position: relative; }
.rs-bottomnav__item.is-active { color: var(--ink); }
.rs-bottomnav__item.is-active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px; background: var(--brand); }
@media (min-width: 768px) { .rs-bottomnav--auto { display: none; } }

/* Tabs -------------------------------------------------------------- */
.rs-tabs { container-type: inline-size; background: var(--surface-100); box-shadow: inset 0 -1px 0 var(--line); }
.rs-tabs--overlay { background: var(--surface-glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.rs-tabs__list { display: flex; gap: var(--space-5); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding: 0 var(--gutter-sm); }
.rs-tabs__list::-webkit-scrollbar { display: none; }
.rs-tab { position: relative; flex: none; scroll-snap-align: start; height: 52px; padding: 0 2px; border: 0; background: none; cursor: pointer; color: var(--ink-muted); font: 500 15px/20px var(--font-sans); white-space: nowrap; }
.rs-tab:hover { color: var(--ink); }
.rs-tab.is-active { color: var(--ink); }
.rs-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--brand); }
@container (min-width: 768px) {
  .rs-tabs__list { justify-content: space-between; gap: var(--space-6); padding: 0 var(--gutter-md); }
  .rs-tab { height: 60px; }
}
@container (min-width: 1280px) { .rs-tabs__list { padding: 0 var(--gutter-lg); } }

/* GenreChips -------------------------------------------------------- */
.rs-chips { container-type: inline-size; background: var(--surface-200); }
.rs-chips__list { display: flex; gap: var(--space-3); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding: var(--space-4) var(--gutter-sm); }
.rs-chips__list::-webkit-scrollbar { display: none; }
.rs-chip { flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; height: var(--chip-height); min-width: 88px; justify-content: center; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-pill); background: var(--surface-300); color: var(--ink); cursor: pointer; font: 500 13px/16px var(--font-sans); transition: background-color .15s ease; }
.rs-chip:hover { background: var(--surface-400); }
.rs-chip.is-selected { background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-glow); }
.rs-chip.is-selected:hover { background: var(--brand-hover); }
@media (pointer: coarse) { .rs-chip { height: 40px; } }
/* chips share the page gutters, so the first chip lines up with the first tab and row title */
@container (min-width: 768px) { .rs-chips__list { padding-inline: var(--gutter-md); scroll-padding-inline: var(--gutter-md); } }
@container (min-width: 1024px) { .rs-chips__list { flex-wrap: wrap; overflow: visible; } }
@container (min-width: 1280px) { .rs-chips__list { padding-inline: var(--gutter-lg); } }

/* AgeBadge ---------------------------------------------------------- */
.rs-age { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-xs); background: var(--gold-deep); color: var(--on-gold); font: 700 11px/14px var(--font-sans); letter-spacing: .02em; }

/* RatingBadge ------------------------------------------------------- */
.rs-score { display: inline-flex; align-items: center; gap: var(--space-1); font: 600 13px/16px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--ink); }
.rs-score--gold .rs-icon { color: var(--gold); }
.rs-score--gold { color: var(--gold); }
.rs-score--brand .rs-icon { color: var(--brand); }
.rs-score--md { font-size: 16px; line-height: 20px; gap: 6px; }
.rs-score__votes { font-weight: 400; color: var(--ink-muted); }

/* RatingInput ------------------------------------------------------- */
.rs-rate { display: inline-flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.rs-rate__stars { display: inline-flex; gap: var(--space-1); }
.rs-rate__star { position: relative; width: 28px; height: 28px; }
.rs-rate__base { color: var(--surface-400); stroke: var(--outline); stroke-width: 1.2; }
.rs-rate__fill { position: absolute; inset: 0 auto 0 0; overflow: hidden; color: var(--gold); pointer-events: none; transition: width .1s ease; }
.rs-rate__hit { position: absolute; top: -6px; bottom: -6px; width: 50%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; }
.rs-rate__hit--l { left: 0; }
.rs-rate__hit--r { right: 0; }
.rs-rate__readout { font: 600 15px/20px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--ink-muted); min-width: 64px; }
@media (pointer: coarse) { .rs-rate__star { width: 40px; height: 40px; } .rs-rate__star .rs-icon { width: 40px; height: 40px; } }

/* MovieCard --------------------------------------------------------- */
.rs-card { width: var(--poster-width-sm); min-width: 0; }
.rs-card__poster { display: block; color: inherit; text-decoration: none; aspect-ratio: 2 / 3; border-radius: var(--radius-sm); overflow: hidden; background: var(--backdrop); transition: transform .2s ease, box-shadow .2s ease; }
.rs-card__poster:hover, .rs-card__poster:focus-visible { transform: translateY(-4px); box-shadow: var(--shadow-poster); }
.rs-poster__img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rs-poster__fallback { display: grid; place-items: center; width: 100%; height: 100%; font: 400 72px/1 var(--font-display); color: var(--ink); }
.rs-poster__fallback--night { background: var(--backdrop); }
.rs-poster__fallback--red { background: var(--brand-press); }
.rs-poster__fallback--gold { background: var(--gold-deep); color: var(--on-gold); }
.rs-poster__fallback--slate { background: var(--surface-400); }
.rs-card__title { margin: var(--space-3) 0 2px; font: 500 15px/20px var(--font-sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-card__meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 var(--space-2); min-height: 28px; }
.rs-card__year { flex: none; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.rs-card__actions { display: flex; align-items: center; gap: 0; flex: none; margin-left: auto; }
.rs-card__actions .rs-score { margin-left: var(--space-1); }
@media (min-width: 768px) { .rs-card { width: var(--poster-width-lg); } }
.rs-row .rs-card { width: var(--poster-width-sm); }
@container (min-width: 768px) { .rs-row .rs-card { width: var(--poster-width-lg); } }

/* PosterRow --------------------------------------------------------- */
.rs-row { container-type: inline-size; padding: var(--space-5) 0; }
.rs-row__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); padding: 0 var(--gutter-sm) var(--space-3); }
.rs-row__title { margin: 0; font: 600 20px/28px var(--font-sans); color: var(--ink); }
.rs-row__all { color: var(--brand-text); font: 500 13px/16px var(--font-sans); text-decoration: none; white-space: nowrap; }
.rs-row__all:hover { text-decoration: underline; }
.rs-row__frame { position: relative; }
.rs-row__track { display: flex; gap: var(--space-3); margin: 0; padding: var(--space-2) var(--gutter-sm) var(--space-3); list-style: none; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter-sm); scrollbar-width: none; overscroll-behavior-x: contain; }
.rs-row__track::-webkit-scrollbar { display: none; }
.rs-row__item { flex: none; scroll-snap-align: start; }
.rs-row__arrow { position: absolute; top: 38%; transform: translateY(-50%); z-index: var(--z-row-arrows); display: none; }
.rs-row__arrow--l { left: var(--space-2); }
.rs-row__arrow--r { right: var(--space-2); }
@container (min-width: 768px) {
  .rs-row__head { padding: 0 var(--gutter-md) var(--space-4); }
  .rs-row__track { gap: var(--space-4); padding-inline: var(--gutter-md); scroll-padding-inline: var(--gutter-md); }
}
@container (min-width: 1024px) {
  .rs-row__frame:hover .rs-row__arrow, .rs-row__arrow:focus-visible { display: inline-grid; }
}
@container (min-width: 1280px) {
  .rs-row__head { padding: 0 var(--gutter-lg) var(--space-4); }
  .rs-row__track { padding-inline: var(--gutter-lg); scroll-padding-inline: var(--gutter-lg); }
}
@media (hover: none) { .rs-row__arrow { display: none !important; } }

/* Hero -------------------------------------------------------------- */
.rs-hero { container-type: inline-size; position: relative; background: var(--surface-0); overflow: hidden; }
.rs-hero__art { position: relative; aspect-ratio: 4 / 3; background: var(--backdrop); }
.rs-hero__art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rs-hero__art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(1, 1, 3, 0) 45%, var(--surface-0) 100%); }
.rs-hero__body { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); margin-top: -64px; padding: 0 var(--gutter-sm) var(--space-6); }
.rs-hero__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font: 400 15px/20px var(--font-sans); color: var(--ink); }
.rs-hero__meta > * + *::before { content: "•"; margin-right: var(--space-5); color: var(--ink-muted); font-size: 10px; vertical-align: 2px; }
.rs-hero__meta > * + * { display: inline-flex; align-items: center; }
.rs-hero__title { margin: var(--space-1) 0 0; font: 300 22px/30px var(--font-sans); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
.rs-hero__synopsis { margin: 0; max-width: 52ch; font: 400 16px/24px var(--font-sans); color: var(--ink); }
.rs-hero__actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); width: 100%; margin-top: var(--space-3); }
.rs-hero__foot { position: relative; }
@container (max-width: 359px) { .rs-hero__actions { grid-template-columns: 1fr; } }
@container (min-width: 480px) { .rs-hero__actions { display: flex; width: auto; } }
@container (min-width: 768px) {
  .rs-hero__art { position: absolute; inset: 0; aspect-ratio: auto; }
  .rs-hero__art::after { background: linear-gradient(to right, var(--scrim) 0%, rgba(1, 1, 3, .6) 40%, rgba(1, 1, 3, 0) 70%), linear-gradient(to bottom, rgba(1, 1, 3, 0) 60%, var(--surface-0) 100%); }
  .rs-hero__body { min-height: 520px; box-sizing: border-box; justify-content: center; gap: var(--space-4); margin: 0; padding: var(--space-8) var(--gutter-md); max-width: 620px; }
  .rs-hero__title { font-size: 32px; line-height: 40px; letter-spacing: .5em; }
  .rs-hero__synopsis { font-size: 17px; line-height: 26px; }
}
@container (min-width: 1280px) { .rs-hero__body { min-height: 600px; padding-inline: var(--gutter-lg); max-width: 700px; } }

@media (prefers-reduced-motion: reduce) {
  .rs-btn, .rs-card__poster, .rs-rate__fill, .rs-chip, .rs-iconbtn { transition: none; }
  .rs-card__poster:hover { transform: none; }
}

</style>
<style>
/* Layout: sticky chrome-black index on the left, page-dark reference column on the right; collapses to a scrolling index strip on phones.
   Single dark look on purpose: Reelscore has one theme. Page-only additions below; everything else is a Reelscore token. */
:root {
  color-scheme: dark;
  --doc-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --doc-rule: #232228;      /* hairline between rows, a step above --line so it reads on surface-100 */
  --doc-code-bg: #0b0b0e;   /* code blocks sit between surface-0 and surface-100 */
  --doc-sidebar: 248px;
}
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--surface-100); color: var(--ink); font: 400 15px/22px var(--font-sans); }

.doc { display: grid; grid-template-columns: var(--doc-sidebar) minmax(0, 1fr); min-height: 100vh; }

/* Index ----------------------------------------------------------- */
.idx { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto; background: var(--surface-0); box-shadow: 1px 0 0 var(--line); padding-block: 28px; padding-inline: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; }
.idx__brand { display: flex; flex-direction: column; gap: 2px; }
.idx__mark { font: 400 34px/34px var(--font-display); letter-spacing: .02em; color: var(--brand); text-transform: uppercase; }
.idx__sub { font: 500 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.idx__group { display: flex; flex-direction: column; gap: 2px; }
.idx__label { font: 500 11px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px; }
.idx a { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; margin-inline: -10px; border-radius: var(--radius-md); color: var(--ink-muted); text-decoration: none; font: 500 15px/20px var(--font-sans); transition: color .15s ease, background-color .15s ease; }
.idx a:hover { color: var(--ink); background: var(--surface-200); }
.idx a.is-current { color: var(--ink); background: var(--surface-200); box-shadow: inset 2px 0 0 var(--brand); }
.idx a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.idx__count { font: 400 12px/16px var(--doc-mono); color: var(--ink-faint); }

/* Main column ----------------------------------------------------- */
.main { min-width: 0; padding-block: 48px 96px; padding-inline: clamp(16px, 5vw, 64px); display: flex; flex-direction: column; gap: 72px; }
.intro { max-width: 68ch; display: flex; flex-direction: column; gap: 16px; }
.intro h1 { margin: 0; font: 300 32px/40px var(--font-sans); letter-spacing: .5em; text-transform: uppercase; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-muted); font-size: 17px; line-height: 26px; }
.intro code, .comp p code, .rules code, .props code { font: 400 0.9em/1 var(--doc-mono); color: var(--ink); background: var(--surface-300); padding: 2px 5px; border-radius: 3px; }

        { n: 'className', t: 'string', d: 'Extra class on the <article>.' }
      ],
      rules: ['Width is 128px under 768px and 184px above. Set the width on a wrapper if a grid needs another size.', 'Leave out the like and watched toggles for signed-out viewers.', 'Posters lift 4px with a shadow on hover and focus.'],
      code: '<MovieCard\n  title="Harbor Lights" year="2024" kind="Film" rating={8.1}\n  poster={posterUrl}\n  liked={liked} onLike={toggleLike}\n  watched={watched} onWatched={toggleWatched}\n/>',
      render: function () {
        function Demo() {
          var l = useState(true), w = useState(false);
          return h('div', { className: 'ex', style: { alignItems: 'flex-start', gap: 16 } },
            h(R.MovieCard, { title: 'Harbor Lights', year: '2024', kind: 'Film', rating: 8.1, tone: 'night', liked: l[0], watched: w[0], onLike: function () { l[1](!l[0]); }, onWatched: function () { w[1](!w[0]); } }),
            h(R.MovieCard, { title: 'Ironbark', year: '2023', rating: 7.3, tone: 'red', liked: false, onLike: function () {}, onWatched: function () {} }),
            h(R.MovieCard, { title: 'The Long Orbit: Second Contact', year: '2022', kind: '2 seasons', rating: 9.2, tone: 'gold' }),
            h(R.MovieCard, { title: 'Salt & Static', year: '2025', rating: 6.4, tone: 'slate', watched: true, onLike: function () {}, onWatched: function () {} }));
        }
        return h(Demo);
      }
    },
    {
      name: 'PosterRow', group: 'Content', responsive: true,
      summary: 'A titled, horizontally scrolling row of MovieCards. It swipes on phones and gets arrow buttons on desktop.',
      props: [
        { n: 'children', t: 'ReactNode', d: 'The MovieCards. Each is wrapped in a list item that snaps to the gutter.' },
        { n: 'title', t: 'string', d: 'Row heading, such as "Trending now" or "Because you rated Ironbark".' },
        { n: 'seeAllHref', t: 'string', d: 'Shows a red "See all" link beside the title. Needs a title.' },
        { n: 'label', t: 'string', d: 'Accessible name for a row with no visible title.' },
        { n: 'className', t: 'string', d: 'Extra class on the <section>.' }
      ],
      rules: ['From 1024px of row width, scrim arrows appear on hover or keyboard focus and scroll by most of a screen. They never show on touch-only devices.', 'Keep it to about 20 cards per row and link the rest with seeAllHref.'],
      code: '<PosterRow title="Trending now" seeAllHref="/trending">\n  {films.map((f) => <MovieCard key={f.id} {...f} />)}\n</PosterRow>',
      flush: true, surface: 'var(--surface-100)',
      render: function () { return h(R.PosterRow, { title: 'Trending now', seeAllHref: '#' }, cards(8)); }
    },
    {
      name: 'Hero', group: 'Content', responsive: true,
      summary: 'The featured title at the top of a page: artwork, age badge, score, year, a spaced uppercase title, a synopsis and the Watch / Add to list pair.',
      props: [
        { n: 'title', t: 'string', req: true, d: 'Featured title, set uppercase with wide letter-spacing.' },
        { n: 'image', t: 'string', d: 'Wide artwork URL, at least 1600px. Choose art with the subject on the right half so the scrim never covers a face.' },
        { n: 'ageRating', t: 'string', d: 'Shown as an AgeBadge above the meta row.' },
        { n: 'rating', t: 'number', d: 'Score out of 10, shown as a brand-red RatingBadge.' },
        { n: 'year', t: 'string | number', d: 'Release year in the meta row.' },
        { n: 'length', t: 'string', d: 'Runtime or seasons, such as "1h 54m" or "2 seasons".' },
        { n: 'synopsis', t: 'string', d: 'One or two sentences, under 160 characters.' },
        { n: 'watchLabel', t: 'string', def: '"Watch trailer"', d: 'Primary button label.' },
        { n: 'addLabel', t: 'string', def: '"Add to list"', d: 'Secondary button label.' },
        { n: 'onWatch', t: '() => void', d: 'Primary button handler.' },
        { n: 'onAddToList', t: '() => void', d: 'Secondary button handler.' },
        { n: 'children', t: 'ReactNode', d: 'A band along the bottom edge, usually <Tabs overlay />.' },
        { n: 'className', t: 'string', d: 'Extra class on the <section>.' }
      ],
      rules: ['Phones: artwork on top at 4:3, copy below, buttons side by side at full width (stacked under 360px).', 'From 768px: copy sits over the artwork on the left, protected by a scrim gradient.'],
      code: '<Hero\n  title="The Long Orbit" ageRating="13+" rating={7.5}\n  year="2024" length="2 seasons"\n  synopsis="Stranded on a frozen moon, a salvage crew has one week to signal home."\n  image={artUrl}\n  onWatch={playTrailer} onAddToList={addToList}\n>\n  <Tabs overlay label="Browse" items={tabs} />\n</Hero>',
      flush: true,
      render: function () {
        return h(R.Hero, { title: 'The Long Orbit', ageRating: '13+', rating: 7.5, year: '2024', length: '2 seasons', synopsis: 'Stranded on a frozen moon, a salvage crew has one week to signal home before the station’s reactor fails.' },
          h(R.Tabs, { items: TABS, overlay: true, label: 'Browse' }));
      },
      note: 'No artwork is set here, so the backdrop color shows where the image would load.'
    }
  ];

  var GROUPS = ['Foundations', 'Actions', 'Navigation', 'Filters', 'Ratings', 'Content'];
  var slug = function (s) { return s.toLowerCase(); };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* Type cell: string-literal unions get the literal color */
  function typeHtml(t) {
    return esc(t).replace(/&quot;|"([^"]*)"/g, function (m) { return '<span class="lit">' + m + '</span>'; });
  }
  /* Tiny JSX highlighter for the usage blocks */
  function hl(code) {
    /* one pass, so no rule re-matches markup another rule inserted */
    return esc(code).replace(/("[^"\n]*")|(&lt;\/?)([A-Z][A-Za-z]*)|\b([a-zA-Z]+)(?==)/g, function (m, str, open, tag, attr) {
      if (str) return '<span class="t-str">' + str + '</span>';
      if (tag) return open + '<span class="t-tag">' + tag + '</span>';
      return '<span class="t-attr">' + attr + '</span>';
    });
  }

  /* Index */
  var idx = document.getElementById('idx');
  var brand = document.createElement('div');
  brand.className = 'idx__brand';
  brand.innerHTML = '<span class="idx__mark">Reelscore</span><span class="idx__sub">Component reference</span>';
  idx.appendChild(brand);
  GROUPS.forEach(function (g) {
    var items = DOCS.filter(function (d) { return d.group === g; });
    var box = document.createElement('div');
    box.className = 'idx__group';
    box.innerHTML = '<p class="idx__label">' + g + '</p>' + items.map(function (d) {
      return '<a href="#' + slug(d.name) + '" data-target="' + slug(d.name) + '">' + d.name + '<span class="idx__count">' + d.props.length + '</span></a>';
    }).join('');
    idx.appendChild(box);
  });

  var totalProps = DOCS.reduce(function (a, d) { return a + d.props.length; }, 0);
  document.getElementById('facts').innerHTML =
    '<li><strong>' + DOCS.length + '</strong> components</li>' +
    '<li><strong>' + totalProps + '</strong> props</li>' +
    '<li><strong>' + R.Icon.names.length + '</strong> icons</li>' +
    '<li>React <strong>18</strong></li>';

  /* Sections, in index order */
  var main = document.getElementById('main');
  var ordered = [];
  GROUPS.forEach(function (g) { DOCS.forEach(function (d) { if (d.group === g) ordered.push(d); }); });

  ordered.forEach(function (d) {
    var id = slug(d.name);
    var sec = document.createElement('section');
    sec.className = 'comp';
    sec.id = id;
    sec.setAttribute('aria-labelledby', id + '-h');

    var rows = d.props.map(function (p) {
      return '<tr>' +
        '<td><span class="p-name">' + p.n + '</span>' + (p.req ? '<span class="p-req">Required</span>' : '') + '</td>' +
        '<td class="p-type">' + typeHtml(p.t) + '</td>' +
        '<td>' + (p.def ? '<span class="p-def">' + esc(p.def) + '</span>' : '<span class="p-none">—</span>') + '</td>' +
        '<td class="p-desc"><p>' + esc(p.d) + '</p>' + (p.shape ? '<div class="p-shape">' + esc(p.shape) + '</div>' : '') + '</td>' +
        '</tr>';
    }).join('');
    var statics = (d.statics || []).map(function (p) {
      return '<tr><td><span class="p-name">' + p.n + '</span></td><td class="p-type">' + esc(p.t) + '</td><td><span class="p-none">static</span></td><td class="p-desc"><p>' + esc(p.d) + '</p></td></tr>';
    }).join('');

    var bar = '<div class="stage__bar"><span class="stage__title">Live example</span>' +
      (d.responsive ? '<div class="seg" role="group" aria-label="Preview width">' +
        '<button type="button" id="' + id + '-w-full" data-w="full" aria-pressed="' + (d.startPhone ? 'false' : 'true') + '">Full width</button>' +
        '<button type="button" id="' + id + '-w-phone" data-w="phone" aria-pressed="' + (d.startPhone ? 'true' : 'false') + '">Phone 375</button></div>' : '') +
      '</div>';

    sec.innerHTML =
      '<div class="comp__head">' +
        '<p class="comp__eyebrow">' + d.group + '</p>' +
        '<h2 class="comp__name" id="' + id + '-h"><a href="#' + id + '">' + d.name + '</a></h2>' +
        '<p class="comp__sum">' + esc(d.summary) + '</p>' +
      '</div>' +
      '<div class="stage" data-width="' + (d.startPhone ? 'phone' : 'full') + '">' + bar +
        '<div class="stage__canvas' + (d.flush ? ' stage__canvas--flush' : '') + '"' + (d.surface ? ' style="background:' + d.surface + '"' : '') + '>' +
          '<div class="stage__frame" id="' + id + '-root"></div></div>' +
      '</div>' +
      (d.note ? '<p class="props-note" style="margin-top:-12px">' + esc(d.note) + '</p>' : '') +
      '<div class="code"><button type="button" class="copy" id="' + id + '-copy">Copy</button><pre><code>' + hl(d.code) + '</code></pre></div>' +
      '<h3 class="sub">Props</h3>' +
      '<div class="props-wrap"><table class="props"><thead><tr><th scope="col">Prop</th><th scope="col">Type</th><th scope="col">Default</th><th scope="col">Description</th></tr></thead><tbody>' + rows + statics + '</tbody></table></div>' +
      (d.rest ? '<p class="props-note">' + esc(d.rest) + '</p>' : '') +
      '<h3 class="sub">Guidelines</h3>' +
      '<ul class="rules">' + d.rules.map(function (r) { return '<li><span>' + r + '</span></li>'; }).join('') + '</ul>';

    main.appendChild(sec);

    try {
      ReactDOM.createRoot(document.getElementById(id + '-root')).render(d.render());
    } catch (e) {
      document.getElementById(id + '-root').textContent = 'This example could not render: ' + e.message;
    }

    var stage = sec.querySelector('.stage');
    sec.querySelectorAll('.seg button').forEach(function (b) {
      b.addEventListener('click', function () {
        stage.setAttribute('data-width', b.getAttribute('data-w'));
        sec.querySelectorAll('.seg button').forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      });
    });

    var copyBtn = document.getElementById(id + '-copy');
    copyBtn.addEventListener('click', function () {
      var pre = sec.querySelector('.code pre');
      function selectIt() {
        var r = document.createRange(); r.selectNodeContents(pre);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        copyBtn.textContent = 'Selected';
      }
      try {
        navigator.clipboard.writeText(d.code).then(function () { copyBtn.textContent = 'Copied'; }, selectIt);
      } catch (e) { selectIt(); }
      setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1600);
    });
  });

  /* Highlight the section in view */
  var links = Array.prototype.slice.call(idx.querySelectorAll('a[data-target]'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) {
          var on = a.getAttribute('data-target') === e.target.id;
          a.classList.toggle('is-current', on);
          if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
          if (on && window.matchMedia('(max-width: 900px)').matches) a.scrollIntoView({ block: 'nearest', inline: 'center' });
        });
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('.comp').forEach(function (s) { io.observe(s); });
  }
})();
</script>
