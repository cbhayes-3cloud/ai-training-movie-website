<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CastStrip — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  var people = [['Hollis Brandt', 'Mara Quill'], ['Juno Okafor', 'Teddy Quill'], ['Pell Marston', 'Arran Doyle'], ['Sabine Roux', 'Nell Fairley'], ['Cal Whitlock', 'Young Mara'], ['Odette Lin', 'Harbourmaster'], ['Rafe Delacroix', 'Father Corran'], ['Ama Boateng', 'Ferry pilot']]
    .map(function (p) { return { name: p[0], role: p[1], href: '#' }; });
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h('p', { className: 'pv-label' }, 'With a leader frame (title="Harbor Lights")'),
      h(R.CastStrip, { title: 'Harbor Lights', people: people })));
</script>
</body>
</html>
