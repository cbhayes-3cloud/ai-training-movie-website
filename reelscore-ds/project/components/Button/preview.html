<!-- @dsCard group="Actions" height=170 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .pv-split { display: flex; gap: 24px; align-items: flex-start; }
  .pv-phone { width: 375px; flex: none; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); position: relative; }
  .pv-wide { flex: 1; min-width: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); }

</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv', style: { background: 'var(--surface-0)' } },
      h('div', { className: 'pv-row' },
        h(R.Button, { icon: 'play' }, 'Watch trailer'),
        h(R.Button, { variant: 'secondary', icon: 'plus' }, 'Add to list'),
        h(R.Button, { variant: 'ghost' }, 'Write a review'),
        h(R.Button, { size: 'sm', icon: 'star' }, 'Rate'),
        h(R.Button, { disabled: true }, 'Rated')),
      h('div', { style: { width: '343px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } },
        h(R.Button, { icon: 'play', fullWidth: true }, 'Watch'),
        h(R.Button, { variant: 'secondary', icon: 'plus', fullWidth: true }, 'My list')),
      h('p', { className: 'pv-label' }, 'Phone: full-width pair, 44px tall')));
</script>
</body>
</html>
