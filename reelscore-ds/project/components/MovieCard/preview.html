<!-- @dsCard group="Content" height=380 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MovieCard — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .pv-split { display: flex; gap: 24px; align-items: flex-start; }
  .pv-phone { width: 375px; flex: none; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); position: relative; }
  .pv-wide { flex: 1; min-width: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); }

</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  function cards(n) {
    var data = [['Harbor Lights', '2024', 8.1, 'night'], ['Ironbark', '2023', 7.3, 'red'], ['Salt & Static', '2025', 6.4, 'slate'], ['The Long Orbit', '2022', 9.2, 'gold'], ['Quiet Hours', '2024', 5.8, 'night'], ['Paper Lanterns', '2021', 7.9, 'slate'], ['Northline', '2025', 8.6, 'red'], ['Glass Orchard', '2023', 6.9, 'night']];
    return data.slice(0, n).map(function (d, i) { return h(R.MovieCard, { key: i, title: d[0], year: d[1], rating: d[2], tone: d[3], liked: i % 3 === 0, watched: i % 2 === 0, onLike: function () {}, onWatched: function () {} }); });
  }
  function Demo() {
    var l = React.useState(true), w = React.useState(false);
    return h('div', { className: 'pv pv-row', style: { flexDirection: 'row', alignItems: 'flex-start', gap: '16px' } },
      h(R.MovieCard, { title: 'Harbor Lights', year: '2024', kind: 'Film', rating: 8.1, tone: 'night', liked: l[0], watched: w[0], onLike: function () { l[1](!l[0]); }, onWatched: function () { w[1](!w[0]); } }),
      h(R.MovieCard, { title: 'The Long Orbit: Second Contact', year: '2022', kind: '2 seasons', rating: 9.2, tone: 'gold' }),
      h(R.MovieCard, { title: 'Salt & Static', year: '2025', rating: 6.4, tone: 'slate', liked: false, watched: true, onLike: function () {}, onWatched: function () {} }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
