<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Footer — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .pv-phone { width: 375px; max-width: 100%; flex: none; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); }
  .pv-wide { flex: 1; min-width: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); }
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  var links = [{ label: 'About' }, { label: 'Help' }, { label: 'Privacy' }, { label: 'Terms' }];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h('p', { className: 'pv-label' }, 'From 768px'),
      h('div', { className: 'pv-wide' }, h(R.Footer, { links: links, copyright: '© 2026 Reelscore' })),
      h('p', { className: 'pv-label' }, 'Phone: stacked, links wrap'),
      h('div', { className: 'pv-phone' }, h(R.Footer, { links: links, copyright: '© 2026 Reelscore' }))));
</script>
</body>
</html>
