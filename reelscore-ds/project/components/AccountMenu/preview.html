<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AccountMenu — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  function Demo() {
    return h('div', { className: 'pv' },
      h('div', null, h('p', { className: 'pv-label' }, 'Default'), h(R.AccountMenu)),
      h('div', null, h('p', { className: 'pv-label' }, 'Custom rows'),
        h(R.AccountMenu, { groups: [[{ label: 'Watchlist', icon: 'list', href: '#' }], [{ label: 'Settings', icon: 'settings' }, { label: 'Profile', icon: 'user' }]] })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
