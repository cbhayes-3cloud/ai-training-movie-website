<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IconButton — preview</title>
<style>
  body { background: var(--surface-100); }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-label { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .pv-split { display: flex; gap: 24px; align-items: flex-start; }
  .pv-phone { width: 375px; flex: none; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); position: relative; }
  .pv-wide { flex: 1; min-width: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--surface-400); background: var(--surface-100); }

</style></head>
<body>
<div id="root"></div>
<script>
  var R = window.Reelscore, h = React.createElement;
  function Demo() {
    var s = React.useState(true), w = React.useState(false);
    return h('div', { className: 'pv' },
      h('div', { className: 'pv-row' },
        h(R.IconButton, { icon: 'search', label: 'Search' }),
        h(R.IconButton, { icon: 'bell', label: 'Notifications, 2 new', badge: true }),
        h(R.IconButton, { icon: 'plus', label: 'Add to list', variant: 'filled' }),
        h(R.IconButton, { icon: 'list', label: 'Lists', variant: 'outline' }),
        h(R.IconButton, { icon: 'chevronRight', label: 'Scroll forward', variant: 'scrim', size: 'lg' }),
        h(R.IconButton, { icon: 'heart', label: 'Like', size: 'sm', pressed: s[0], onClick: function () { s[1](!s[0]); } }),
        h(R.IconButton, { icon: 'eye', label: 'Mark as watched', size: 'sm', pressed: w[0], onClick: function () { w[1](!w[0]); } })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
